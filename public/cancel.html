<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Payment Cancelled</title>
<style>
  body { font-family: sans-serif; text-align: center; padding-top: 70px; background:#fef2f2; color:#1e293b; }
  a { color:#ef4444; font-weight:700; }
</style>
</head>
<body>
  <h2>⚠️ পেমেন্ট বাতিল হয়েছে</h2>
  <p>বটে ফিরিয়ে নেওয়া হচ্ছে...</p>
  <p><a id="manual-link" href="#">অটো রিডাইরেক্ট না হলে এখানে ক্লিক করুন</a></p>

  <script>
    const BOT_USERNAME = "vpnshop02_bot";
    const target = `https://t.me/${BOT_USERNAME}?start=cancel`;
    document.getElementById("manual-link").href = target;

    const embedded = window.self !== window.top;

    if (embedded) {
      try {
        window.parent.postMessage({ source: "vpnshop", type: "payment_cancel" }, "*");
      } catch (e) { /* ignore */ }
      document.querySelector("p").innerText = "উইন্ডোটি বন্ধ হচ্ছে...";
    } else {
      setTimeout(function () { window.location.href = target; }, 800);
    }
  </script>
</body>
</html>
